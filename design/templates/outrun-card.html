<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
  .card {
    position: relative; width: 1000px; height: 520px; border-radius: 22px; overflow: hidden;
    background: var(--night) url("../../assets/outrun/outrun-key-art-3840x2160.png") center 38% / cover no-repeat;
  }
  /* legibility wash for the title block */
  .card::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(10, 15, 31, .55) 0%, transparent 18%),
      linear-gradient(180deg, transparent 46%, rgba(10, 15, 31, .70) 66%, rgba(10, 15, 31, .96) 100%);
  }
  .tag {
    position: absolute; top: 26px; left: 30px; display: flex; align-items: center; gap: 9px;
    padding: 7px 14px 7px 12px; border-radius: 999px; background: var(--tape); color: var(--night);
    font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .tag b { width: 8px; height: 8px; border-radius: 50%; background: var(--siren-red); box-shadow: 0 0 0 3px rgba(229, 57, 79, .25); }

  .info { position: absolute; left: 34px; right: 34px; bottom: 30px; display: flex; align-items: flex-end; gap: 22px; }
  .icon { width: 112px; height: 112px; flex: none; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .55)); }
  .title { flex: 1; padding-bottom: 6px; }
  .title h1 {
    margin: 0; color: #fff; font-size: 78px; line-height: .9; letter-spacing: .03em;
    text-shadow: -3px 0 0 rgba(229, 57, 79, .9), 3px 0 0 rgba(46, 107, 240, .9), 0 8px 28px rgba(0, 0, 0, .55);
  }
  .title p {
    margin: 12px 0 0 3px; color: var(--tape); font-size: 15px; font-weight: 600;
    letter-spacing: .32em; text-transform: uppercase;
  }
  .chips { display: flex; gap: 10px; padding-bottom: 8px; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #fff;
    background: rgba(10, 15, 31, .55); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28);
    backdrop-filter: blur(6px);
  }
  .chip svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag din"><b></b>Featured Game</div>
    <div class="info">
      <img class="icon" src="../../assets/outrun/outrun-icon-1024.png" alt="">
      <div class="title">
        <h1 class="din-cond">OUTRUN</h1>
        <p class="din">2.5D Isometric Chase Game</p>
      </div>
      <div class="chips din">
        <div class="chip">Free to Play</div>
        <div class="chip">
          <svg viewBox="0 0 16 16"><path fill="#fff" d="M0 0h7.5v7.5H0zM8.5 0H16v7.5H8.5zM0 8.5h7.5V16H0zM8.5 8.5H16V16H8.5z"/></svg>
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.637.637 0 0 0-.83.22l-1.88 3.24a11.43 11.43 0 0 0-8.94 0L5.65 5.67a.643.643 0 0 0-.87-.2c-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>
          Windows · Android
        </div>
      </div>
    </div>
  </div>
</body>
</html>

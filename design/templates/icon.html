<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
  /* Dark tile with a soft rim: reads as a deliberate "app tile" on GitHub light and dark alike. */
  .tile {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
    background:
      radial-gradient(40px 30px at 0% 0%, rgba(229, 57, 79, .22), transparent 70%),
      radial-gradient(40px 30px at 100% 0%, rgba(46, 107, 240, .26), transparent 70%),
      linear-gradient(180deg, #172042 0%, var(--night) 100%);
    box-shadow: inset 0 0 0 1.5px rgba(163, 174, 205, .30);
  }
  .tile svg { width: 38px; height: 38px; overflow: visible; }
  .glyph { width: 64px; height: 64px; display: grid; place-items: center; }
  .glyph svg { width: 60px; height: 60px; }
  svg .w { stroke: #f3f6f9; }
  svg .s { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const R = "#e5394f", B = "#2e6bf0", Y = "#ffcc4f", W = "#f3f6f9";
const ICONS = {
  /* escalating pursuit — siren dome with red/blue halves */
  pursuit: `
    <path d="M9 22V16a7 7 0 0 1 7-7v13z" fill="${R}"/>
    <path d="M16 9a7 7 0 0 1 7 7v6h-7z" fill="${B}"/>
    <path d="M12 16a4 4 0 0 1 3-3.8" class="s" stroke="#fff" stroke-opacity=".75"/>
    <rect x="5.5" y="22" width="21" height="4.5" rx="1.6" fill="${W}"/>
    <path d="M7.2 9.4 5 7.2M5.8 15.2H2.8" class="s" stroke="${R}"/>
    <path d="M24.8 9.4 27 7.2M26.2 15.2h3" class="s" stroke="${B}"/>
    <path d="M16 5.2V2.4" class="s w"/>`,
  /* battery & durability — battery with charge bolt */
  battery: `
    <rect x="3.5" y="10" width="22" height="13.5" rx="3" class="s w"/>
    <rect x="26.6" y="14" width="2.6" height="5.5" rx="1.1" fill="${W}"/>
    <path d="M16.6 11.8 11.6 17.4h3.7l-1.2 4.4 5.2-6h-3.6z" fill="${Y}" stroke="${Y}" stroke-width=".8" stroke-linejoin="round"/>`,
  /* the city — skyline with lit windows over a lane line */
  city: `
    <path d="M3.5 24.5V13.5h7.5v11M11 24.5V5.5h9.5v19M20.5 24.5V12h8v12.5" class="s w"/>
    <g fill="${Y}">
      <rect x="13.3" y="8.4" width="2" height="2" rx=".4"/><rect x="16.7" y="8.4" width="2" height="2" rx=".4"/>
      <rect x="13.3" y="12.2" width="2" height="2" rx=".4"/><rect x="16.7" y="12.2" width="2" height="2" rx=".4"/>
      <rect x="13.3" y="16" width="2" height="2" rx=".4"/><rect x="16.7" y="16" width="2" height="2" rx=".4"/>
      <rect x="6.3" y="16.4" width="2" height="2" rx=".4"/><rect x="6.3" y="20" width="2" height="2" rx=".4"/>
      <rect x="23.5" y="15" width="2" height="2" rx=".4"/><rect x="23.5" y="18.6" width="2" height="2" rx=".4"/>
    </g>
    <path d="M2 28.6h28" class="s" stroke="${Y}" stroke-dasharray="3.4 3"/>`,
  /* the garage — workshop with roll-up door */
  garage: `
    <path d="M2.8 13.2 16 4.8l13.2 8.4" class="s w"/>
    <path d="M6 11.6V27h20V11.6" class="s w"/>
    <rect x="10" y="16" width="12" height="11" rx="1" fill="none" stroke="${Y}" stroke-width="2"/>
    <path d="M10 19.6h12M10 23.2h12" stroke="${Y}" stroke-width="1.6"/>`,
  /* local scoreboard — trophy */
  scoreboard: `
    <path d="M10 5.5h12v6.5a6 6 0 0 1-12 0z" fill="${Y}"/>
    <path d="M10 8H6.8a3.2 3.2 0 0 0 3.6 5.4M22 8h3.2a3.2 3.2 0 0 1-3.6 5.4" class="s" stroke="${Y}"/>
    <path d="M16 18.2v3.6" class="s" stroke="${Y}" stroke-width="2.6"/>
    <rect x="10.5" y="22.4" width="11" height="4.2" rx="1.3" fill="${W}"/>
    <path d="m16 7.6.9 1.9 2 .3-1.5 1.4.4 2L16 12.2l-1.8 1 .4-2-1.5-1.4 2-.3z" fill="#fff" fill-opacity=".9"/>`,
  /* controls — gamepad */
  controls: `
    <path d="M9.5 9h13a6.5 6.5 0 0 1 6.3 5l1.2 5.6a3.6 3.6 0 0 1-6.3 3L21 19.5H11l-2.7 3.1a3.6 3.6 0 0 1-6.3-3L3.2 14a6.5 6.5 0 0 1 6.3-5z" class="s w"/>
    <path d="M10 12.6v5M7.5 15.1h5" class="s w"/>
    <circle cx="21.2" cy="13.4" r="1.7" fill="${R}"/><circle cx="24.4" cy="16.6" r="1.7" fill="${B}"/>`,
  /* system requirements — desktop + phone */
  specs: `
    <rect x="2.5" y="5.5" width="20" height="14" rx="2" class="s w"/>
    <path d="M9 25.5h7M12.5 19.5v6" class="s w"/>
    <rect x="20" y="11" width="9.5" height="16" rx="2" fill="#0a0f1f" stroke="${Y}" stroke-width="2"/>
    <path d="M23.6 23.6h2.2" class="s" stroke="${Y}"/>`,
};
/* plain platform glyphs (no tile) for table headers */
const GLYPHS = {
  windows: `<svg viewBox="0 0 24 24"><g fill="#2f9bff"><rect x="1" y="1" width="10.4" height="10.4" rx=".6"/><rect x="12.6" y="1" width="10.4" height="10.4" rx=".6"/><rect x="1" y="12.6" width="10.4" height="10.4" rx=".6"/><rect x="12.6" y="12.6" width="10.4" height="10.4" rx=".6"/></g></svg>`,
  android: `<svg viewBox="0 2 24 20"><path fill="#3ddc84" d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.637.637 0 0 0-.83.22l-1.88 3.240a11.43 11.43 0 0 0-8.94 0L5.65 5.67a.643.643 0 0 0-.87-.2c-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>`,
};
const name = new URLSearchParams(location.search).get("icon");
document.getElementById("root").innerHTML = GLYPHS[name]
  ? `<div class="glyph">${GLYPHS[name]}</div>`
  : `<div class="tile"><svg viewBox="0 0 32 32">${ICONS[name]}</svg></div>`;
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
  /* Section divider: a road lane marking with a siren light at its centre. */
  .divider { position: relative; width: 1000px; height: 40px; display: flex; align-items: center; gap: 22px; }
  .lane { flex: 1; height: 4px; border-radius: 2px; }
  /* dashes are anchored at the siren so both sides are mirror images */
  .lane.l {
    background: repeating-linear-gradient(270deg, var(--lane) 0 30px, transparent 30px 52px);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
  }
  .lane.r {
    background: repeating-linear-gradient(90deg, var(--lane) 0 30px, transparent 30px 52px);
    -webkit-mask-image: linear-gradient(270deg, transparent 0%, #000 55%);
            mask-image: linear-gradient(270deg, transparent 0%, #000 55%);
  }
  .siren { display: flex; gap: 4px; flex: none; }
  .siren i { display: block; width: 26px; height: 14px; border-radius: 7px; }
  .siren i:first-child { background: var(--siren-red);  box-shadow: 0 0 9px rgba(229, 57, 79, var(--glow)); }
  .siren i:last-child  { background: var(--siren-blue); box-shadow: 0 0 9px rgba(46, 107, 240, var(--glow)); }
  .dark  { --lane: var(--tape);  --glow: .7; }
  .light { --lane: var(--amber); --glow: .3; }
</style>
</head>
<body>
  <div class="divider"><div class="lane l"></div><div class="siren"><i></i><i></i></div><div class="lane r"></div></div>
<script>document.body.className = new URLSearchParams(location.search).get("theme") || "dark";</script>
</body>
</html>
